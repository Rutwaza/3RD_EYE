<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">3rd Eye eagle emblem</title>
  <desc id="logo-desc">A white and midnight-blue eagle with gold-trimmed wings spreads over a globe beneath a compass star.</desc>
  <defs>
    <radialGradient id="shield" cx="50%" cy="40%" r="68%">
      <stop offset="0" stop-color="#123b70"/><stop offset=".72" stop-color="#061a35"/><stop offset="1" stop-color="#020915"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a1"/><stop offset=".35" stop-color="#f8c44f"/><stop offset=".72" stop-color="#d99420"/><stop offset="1" stop-color="#ffe080"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff"/><stop offset=".62" stop-color="#e8edf4"/><stop offset="1" stop-color="#9daabd"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c2f5b"/><stop offset="1" stop-color="#020b19"/>
    </linearGradient>
    <g id="feather-row" stroke="#030914" stroke-width="2.5" stroke-linejoin="round">
      <path d="M8 0C-8 27-9 61 4 88c8-18 16-51 4-88Z" fill="url(#feather)"/>
      <path d="M29 1C10 30 10 67 23 94c10-21 18-57 6-93Z" fill="url(#feather)"/>
      <path d="M50 5C30 35 31 72 44 99c11-22 19-58 6-94Z" fill="url(#feather)"/>
      <path d="M71 12C51 42 52 78 66 104c12-22 18-57 5-92Z" fill="url(#feather)"/>
      <path d="M92 21C71 49 73 84 88 109c12-22 18-55 4-88Z" fill="url(#feather)"/>
      <path d="M111 32C91 58 95 91 110 114c12-21 16-51 2-82Z" fill="url(#feather)"/>
      <path d="M130 46C111 68 116 98 132 119c11-19 14-46-2-73Z" fill="url(#feather)"/>
      <path d="M148 61C131 80 138 106 154 124c10-17 11-39-6-63Z" fill="url(#feather)"/>
    </g>
    <clipPath id="globe-clip"><circle cx="256" cy="419" r="48"/></clipPath>
  </defs>

  <!-- Round midnight shield and gold rim -->
  <circle cx="256" cy="258" r="217" fill="url(#shield)" stroke="#050913" stroke-width="10"/>
  <circle cx="256" cy="258" r="211" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- Spread wings, drawn once and mirrored -->
  <g stroke="#030914" stroke-width="5" stroke-linejoin="round">
    <path d="M244 213 171 161 29 57l24 83-38-22 35 91-31-8 57 69 49 67 57 20 80-46Z" fill="url(#wing)"/>
    <path d="M268 213 341 161 483 57l-24 83 38-22-35 91 31-8-57 69-49 67-57 20-80-46Z" fill="url(#wing)"/>
  </g>
  <g transform="translate(38 81) rotate(-10)"><use href="#feather-row"/></g>
  <g transform="translate(474 81) scale(-1 1) rotate(-10)"><use href="#feather-row"/></g>
  <g fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round">
    <path d="M31 58 171 160l72 52-26 14-27-12-22-21-28-3-21-20-31-4-16-22-27-5Z"/>
    <path d="m481 58-140 102-72 52 26 14 27-12 22-21 28-3 21-20 31-4 16-22 27-5Z"/>
  </g>
  <!-- Layered navy flight feathers -->
  <g fill="#0b2c55" stroke="#020914" stroke-width="4" stroke-linejoin="round">
    <path d="M234 201 184 177l30 45-42-17 36 47-48-19 41 54-48-24 55 77 59-68Z"/>
    <path d="M278 201 328 177l-30 45 42-17-36 47 48-19-41 54 48-24-55 77-59-68Z"/>
  </g>

  <!-- Compass star -->
  <path d="m256 25 12 60 51 16-51 12-12 59-12-59-51-12 51-16Z" fill="url(#gold)" stroke="#5e3c12" stroke-width="4" stroke-linejoin="round"/>
  <path d="m256 25 1 76-64 0 63 12 0 59 12-59 51-12-63 0Z" fill="#fff0a5" opacity=".38"/>

  <!-- Eagle head and shoulders -->
  <path d="M256 137c-28 0-52 19-60 51l-27 52 22 54 23 52 42 43 42-43 23-52 22-54-27-52c-8-32-32-51-60-51Z" fill="#07182d" stroke="#020710" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 137c-25 0-43 18-51 44l-19 43 18 17 15-18 12 21 13-15 12 19 12-19 13 15 12-21 15 18 18-17-19-43c-8-26-26-44-51-44Z" fill="url(#feather)" stroke="#111923" stroke-width="4" stroke-linejoin="round"/>
  <path d="M205 180c12-17 30-24 51-24s39 7 51 24l-8 22-18-6-13 12-12-9-12 9-13-12-18 6Z" fill="#f9fbff"/>
  <!-- Eyes -->
  <path d="M204 195q22-17 43 2l-7 17q-24 5-36-19Z" fill="#fff" stroke="#06101f" stroke-width="4"/>
  <path d="M265 197q21-19 43-2-12 24-36 19Z" fill="#fff" stroke="#06101f" stroke-width="4"/>
  <ellipse cx="226" cy="202" rx="6" ry="9" fill="#f2b72e"/><ellipse cx="286" cy="202" rx="6" ry="9" fill="#f2b72e"/>
  <circle cx="227" cy="202" r="3" fill="#030914"/><circle cx="285" cy="202" r="3" fill="#030914"/>
  <path d="m256 199-32 12 21 16 11 38 11-38 21-16Z" fill="url(#gold)" stroke="#14100a" stroke-width="4" stroke-linejoin="round"/>
  <path d="m256 227 0 38" stroke="#9b5b13" stroke-width="3"/>
  <!-- Chest plumage -->
  <g fill="url(#wing)" stroke="#020914" stroke-width="2">
    <path d="m220 259 25 20-17 8 22 16-19 8 25 29-37-27-15-31Z"/>
    <path d="m292 259-25 20 17 8-22 16 19 8-25 29 37-27 15-31Z"/>
  </g>

  <!-- Talons gripping the globe -->
  <g fill="url(#gold)" stroke="#17120a" stroke-width="4" stroke-linejoin="round">
    <path d="M204 336q-18-4-20 12l-10 21q-3 14 8 14l13-20 1 24q5 12 13 3l3-26 7 19q8 8 13-2l-8-32q-5-14-20-13Z"/>
    <path d="M308 336q18-4 20 12l10 21q3 14-8 14l-13-20-1 24q-5 12-13 3l-3-26-7 19q-8 8-13-2l8-32q5-14 20-13Z"/>
  </g>
  <path d="m185 367-9 15q-2 9 6 6l11-17m131-4 9 15q2 9-6 6l-11-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Gold and navy globe -->
  <circle cx="256" cy="419" r="55" fill="#030b18" stroke="#050914" stroke-width="9"/>
  <circle cx="256" cy="419" r="49" fill="url(#gold)" stroke="#f3c14d" stroke-width="4"/>
  <g clip-path="url(#globe-clip)" fill="#08254a" stroke="#08254a" stroke-width="1.5">
    <path d="M215 394l10-9 11 3 3 10-9 6-4 14-9-5-4-11-10-2Zm18 31 9 3 6 11-4 14-6-2-3-13-9-5Zm22-36 11-8 10 3 3 9-8 3-2 10-9 4-7-9Zm17 22 13-7 14 6 8 10-9 7-12-5-9 5-7-8Zm-1 25 11-2 8 10-5 14-11 5-8-11Z"/>
  </g>
  <g clip-path="url(#globe-clip)" fill="none" stroke="#f5c34e" stroke-width="1.4" opacity=".9">
    <ellipse cx="256" cy="419" rx="24" ry="49"/><ellipse cx="256" cy="419" rx="39" ry="49"/>
    <path d="M207 419h98M211 401q45 17 90 0m-90 36q45-17 90 0M216 386q40 14 80 0m-80 66q40-14 80 0"/>
  </g>
  <circle cx="256" cy="419" r="55" fill="none" stroke="url(#gold)" stroke-width="5"/>
</svg>
